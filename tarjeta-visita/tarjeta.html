<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta de visita · Nazareth Gálvez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: 85mm 55mm; margin: 0; }
  :root {
    --garo: #ff2121;
    --garo-dark: #d91414;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    font-family: "Montserrat", "Inter", "DejaVu Sans", sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .card {
    width: 85mm; height: 55mm;
    position: relative; overflow: hidden;
    background: #fff;
    page-break-after: always; break-after: page;
  }
  .card:last-child { page-break-after: auto; break-after: auto; }

  /* ---------- ANVERSO ---------- */
  .front .logos {
    position: absolute; left: 3mm; width: 35mm; top: 0; bottom: 2.2mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3.5mm;
  }
  /* mismo tamaño visual que en el reverso (21 mm alto / 34 mm ancho) */
  .front .logos .garo { display: block; height: 19.5mm; }
  .front .logos .occ { display: block; width: 31.5mm; transform: translateX(-1.8mm); }
  /* centrado óptico: el peso visual de Occident cae a la derecha (texto), se compensa */
  .front .divider {
    position: absolute; left: 40.5mm; top: 11mm; bottom: 12mm;
    width: 0.35mm; background: var(--garo);
  }
  .front .info {
    position: absolute; left: 43.5mm; right: 2.5mm; top: 50%;
    transform: translateY(-50%);
  }
  .front .name {
    font-weight: 800; font-size: 11.2pt; line-height: 1.12;
    letter-spacing: 0.02em; color: var(--ink);
  }
  .front .name span { display: block; color: var(--garo); }
  .front .contact {
    display: flex; align-items: center; gap: 1.4mm;
    color: var(--ink); white-space: nowrap;
  }
  .front .phone {
    margin-top: 4mm;
    font-weight: 600; font-size: 9pt; letter-spacing: 0.03em;
  }
  .front .mail {
    margin-top: 2mm;
    font-weight: 600; font-size: 5.8pt; letter-spacing: -0.01em; gap: 1.2mm;
  }
  .front .phone .icon + .icon { margin-left: -0.6mm; }
  .icon.wa { background: #25d366; }
  .icon.wa svg { width: 3mm; height: 3mm; }
  .icon {
    flex: none; width: 4.6mm; height: 4.6mm; border-radius: 50%;
    background: var(--garo); display: grid; place-items: center;
  }
  .icon svg { width: 2.6mm; height: 2.6mm; fill: #fff; }
  .front .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 2.2mm;
    background: var(--garo);
  }

  /* ---------- REVERSO ---------- */
  .back .logos {
    position: absolute; left: 0; right: 0; top: 0; height: 34mm;
    display: grid; grid-template-columns: 1fr 0.3mm 1fr; align-items: center;
    padding: 0 3mm;
  }
  .back .slot {
    height: 24mm; display: flex; align-items: center; justify-content: center;
  }
  .back .slot img { object-fit: contain; }
  .back .slot .garo { height: 21mm; }
  .back .slot .occ { width: 34mm; }
  .back .sep { height: 18mm; background: #e2e2e2; }
  .back .addresses {
    position: absolute; left: 0; right: 0; bottom: 0; height: 21mm;
    background: var(--garo); color: #fff;
    display: grid; grid-template-columns: 1fr 1fr; gap: 3mm;
    padding: 0 3.5mm; align-items: center; gap: 2mm;
  }
  .addr { display: flex; gap: 1.6mm; align-items: center; }
  .addr .icon { background: #fff; }
  .addr .icon svg { fill: var(--garo); }
  .addr .town {
    font-weight: 700; font-size: 6.5pt; white-space: nowrap; margin-bottom: 0.6mm;
  }
  .addr .street { font-weight: 500; font-size: 6.6pt; line-height: 1.3; opacity: .92; }
  .addr .tel {
    margin-top: 1mm; display: flex; align-items: center; gap: 1mm;
    font-weight: 700; font-size: 7pt; letter-spacing: 0.03em; white-space: nowrap;
  }
  .addr .tel svg { width: 2.4mm; height: 2.4mm; fill: #fff; flex: none; }
</style>
</head>
<body>

  <!-- ANVERSO -->
  <section class="card front">
    <div class="logos">
      <img class="garo" src="assets/garo-mediacion.png" alt="Garo Mediación Seguros">
      <img class="occ" src="assets/occident.png" alt="Occident Cártama-Fuengirola">
    </div>
    <div class="divider"></div>
    <div class="info">
      <h1 class="name">NAZARETH<span>GÁLVEZ</span></h1>
      <div class="contact phone">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg></span>
        <span class="icon wa" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2.2A9.7 9.7 0 0 0 3.7 16.9L2.3 21.8l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.7a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9zm4.4-6c-.24-.12-1.43-.7-1.65-.79-.22-.08-.38-.12-.54.12s-.62.79-.76.95c-.14.16-.28.18-.52.06a6.6 6.6 0 0 1-3.27-2.86c-.25-.43.25-.4.71-1.32.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.39-.4-.54-.4h-.46a.88.88 0 0 0-.64.3 2.7 2.7 0 0 0-.84 2c0 1.18.86 2.32.98 2.48.12.16 1.69 2.58 4.1 3.62 1.52.66 2.12.71 2.88.6.46-.07 1.43-.58 1.63-1.15.2-.57.2-1.05.14-1.15-.06-.1-.22-.16-.46-.28z"/></svg></span>
        615 187 338
      </div>
      <div class="contact mail">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4.3 7H4v.6l8 5.4 8-5.4V7h-.3z"/></svg></span>
        garomediacion@occident.com
      </div>
    </div>
    <div class="band"></div>
  </section>

  <!-- REVERSO -->
  <section class="card back">
    <div class="logos">
      <div class="slot"><img class="garo" src="assets/garo-mediacion.png" alt="Garo Mediación Seguros"></div>
      <div class="sep"></div>
      <div class="slot"><img class="occ" src="assets/occident.png" alt="Occident Cártama-Fuengirola"></div>
    </div>
    <div class="addresses">
      <div class="addr">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span>
        <div>
          <div class="town">Avda. Manuel de Falla, 17</div>
          <div class="street">Estación de Cártama</div>
          <div class="tel"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>952 427 007</div>
        </div>
      </div>
      <div class="addr">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span>
        <div>
          <div class="town">Calle Ricardo León, 1</div>
          <div class="street">Fuengirola</div>
          <div class="tel"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>952 479 912</div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
